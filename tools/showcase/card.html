<!doctype html>
<!-- Powerbar's README hero and plugin preview, rendered by render.sh (headless
     Chromium, 1200x630 at 2x). The picture is one untouched capture,
     screenshots/hero-nord.jpg: Powerbar on the stock nord theme and its own
     wallpaper, keyboard mode inside the System group. Only the words in the
     moon are laid over it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Powerbar card</title>
<style>
  :root {
    --ink: #eceff4;
    --ink-soft: #c9d1dc;
    --sans: "Adwaita Sans", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0 }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #2e3440 }
  body { position: relative; font-family: var(--sans); color: var(--ink) }
  .shot { position: absolute; inset: 0; width: 1200px; height: 630px; display: block }
  /* The wallpaper's black moon (centre 600,216, radius about 176) is the
     field for the words, kept above the star trail that crosses its lower
     third. */
  .moon {
    position: absolute; left: 600px; top: 188px; width: 330px;
    transform: translate(-50%, -50%); text-align: center;
  }
  h1 { font-size: 66px; font-weight: 700; letter-spacing: -0.03em; line-height: 1 }
  p { margin-top: 14px; font-size: 19px; font-weight: 500; line-height: 1.3; color: var(--ink-soft) }
</style>
</head>
<body>
  <img class="shot" src="../../screenshots/hero-nord.jpg" alt="">
  <div class="moon">
    <h1>Powerbar</h1>
    <p>Drawers, groups and a keyboard<br>for Omarchy's bar.</p>
  </div>
</body>
</html>
