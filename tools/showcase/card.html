<!doctype html>
<!-- Powerbar's README hero and plugin preview, rendered by render.sh (headless
     Chromium, 1200x675 at 2x: 16:9, the marketplace's card shape). A field
     drawn from the nord theme's own colours holds one untouched capture,
     screenshots/hero-nord.jpg: a 1920x1080 box at scale 2.5 whose background
     is this same field (render.sh --wall), so the desktop continues it.
     Everything that matters stays inside the screen; card crops between
     about 1.5:1 and 2.4:1 only take field. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Powerbar card</title>
<style>
  :root {
    --background: #2e3440;
    --darker: #191c23;
    --accent: #81a1c1;
    --cyan: #88c0d0;
    --magenta: #b48ead;
    --ink: #2e3440;
    --ink-soft: #3b4252;
    --sans: "Adwaita Sans", "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0 }
  html, body { width: 1200px; height: 675px; overflow: hidden; background: var(--accent) }
  body { position: relative; font-family: var(--sans); color: var(--ink) }
  .field {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 55% 65% at 84% 96%, color-mix(in srgb, var(--magenta) 70%, transparent), transparent 70%),
      radial-gradient(ellipse 60% 70% at 10% 0%, color-mix(in srgb, var(--cyan) 85%, transparent), transparent 72%),
      linear-gradient(150deg, var(--cyan) 0%, var(--accent) 48%, color-mix(in srgb, var(--accent) 70%, var(--background)) 100%);
  }
  /* The box's screen: 880x495 at 160,90 (render.sh --wall crops this
     rectangle as the box background). */
  .screen {
    position: absolute; left: 160px; top: 90px; width: 880px; height: 495px;
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--darker) 30%, transparent),
                0 24px 60px -18px color-mix(in srgb, var(--darker) 55%, transparent);
  }
  .shot { display: block; width: 100%; height: 100% }
  .words {
    position: absolute; left: 600px; top: 383px; width: 600px;
    transform: translate(-50%, -50%); text-align: center;
  }
  h1 { font-size: 72px; font-weight: 700; letter-spacing: -0.03em; line-height: 1 }
  p { margin-top: 14px; font-size: 19px; font-weight: 500; line-height: 1.32; text-wrap: balance; color: var(--ink-soft) }
  body.wall .screen, body.wall .words { display: none }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="screen"><img class="shot" src="../../screenshots/hero-nord.jpg" alt=""></div>
  <div class="words">
    <h1>Powerbar</h1>
    <p>A replacement bar for Omarchy with drawers, in-bar expansion, notch support, configurable visibility, a sophisticated keyboard mode, autohide and a polished Preferences window.</p>
  </div>
  <script>if (location.hash === "#wall") document.body.classList.add("wall")</script>
</body>
</html>
